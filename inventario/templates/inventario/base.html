<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiStock | Inventario Profesional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f6f9; }
        
        /* Estilo de la barra superior (basado en la imagen de referencia) */
        .top-navbar {
            background-color: #fff;
            border-bottom: 2px solid #0056b3; /* Línea azul profesional */
            padding: 15px 30px;
        }
        .company-logo-text {
            color: #0d6efd; /* Azul Bootstrap */
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Menú lateral (Sidebar) */
        .sidebar {
            min-height: calc(100vh - 72px);
            background-color: #fff;
            border-right: 1px solid #dee2e6;
            padding-top: 20px;
        }
        .nav-link-custom {
            color: #495057;
            padding: 12px 20px;
            font-weight: 500;
            display: flex;
            align-items: center;
            border-radius: 5px;
            margin: 5px 10px;
        }
        .nav-link-custom:hover {
            background-color: #e9ecef;
            color: #0d6efd;
        }
        .nav-link-custom.active {
            background-color: #0d6efd;
            color: white;
        }
        .nav-link-custom i {
            margin-right: 15px;
            font-size: 1.1rem;
            width: 25px;
            text-align: center;
        }

        /* Estilos de tablas y tarjetas */
        .card-custom { border: none; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table-custom thead { background-color: #0056b3; color: white; }
        
        /* Botones personalizados (basados en la referencia) */
        .btn-register-custom { background-color: #5a8d44; color: white; border-radius: 4px; border: none; }
        .btn-register-custom:hover { background-color: #466d35; color: white; }
        .btn-delete-custom { background-color: #d9534f; color: white; border-radius: 4px; border: none; }
        .btn-delete-custom:hover { background-color: #c9302c; color: white; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

<nav class="top-navbar d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center">
        <h3 class="mb-0 company-logo-text">OPTI<span style="color: #333;">STOCK</span></h3>
        <span class="text-secondary ms-3">| Gestión de Inventario</span>
    </div>
    <div class="d-flex align-items-center">
        <span class="me-3">Bienvenido, <strong>Administrador</strong></span>
        <button class="btn btn-outline-primary btn-sm">Cerrar Sesión</button>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
            <div class="position-sticky">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link-custom {% if active_page == 'productos' %}active{% endif %}" href="{% url 'lista_productos' %}">
                            <i class="fas fa-box"></i> Productos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link-custom {% if active_page == 'categorias' %}active{% endif %}" href="{% url 'lista_categorias' %}">
                            <i class="fas fa-tags"></i> Categorías
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link-custom {% if active_page == 'almacen' %}active{% endif %}" href="{% url 'lista_almacenes' %}">
                            <i class="fas fa-warehouse"></i> Almacenes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link-custom {% if active_page == 'reportes' %}active{% endif %}" href="{% url 'panel_reportes' %}">
                            <i class="fas fa-chart-line"></i> Reportes
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            {% block content %}
            {% endblock %}
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
